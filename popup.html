<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AutoNope</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="header-title">
      <img src="icons/icon48.png" alt="" width="24" height="24">
      <h1>AutoNope</h1>
    </div>
    <button id="clear-all-btn">Clear all</button>
  </div>
  <p id="empty-msg">No rules yet. Click × on any listing to add one.</p>
  <div id="rules-list"></div>
  <div class="add-rule">
    <input id="new-rule-input" type="text" placeholder="e.g. Toyota, Land Rover, Fiesta">
    <button id="add-btn">Add</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
