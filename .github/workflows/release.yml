name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Zip extension
        run: cd dist && zip -r ../autonope-${{ github.ref_name }}.zip .

      - name: Write signing key
        env:
          EXTENSION_KEY: ${{ secrets.EXTENSION_KEY }}
        run: printf '%s' "$EXTENSION_KEY" > extension.pem

      - name: Pack extension
        run: |
          google-chrome --pack-extension=dist --pack-extension-key=extension.pem --no-message-box
          mv dist.crx autonope-${{ github.ref_name }}.crx

      - name: Remove signing key
        if: always()
        run: rm -f extension.pem

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonope-${{ github.ref_name }}
          path: |
            autonope-${{ github.ref_name }}.zip
            autonope-${{ github.ref_name }}.crx
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            autonope-${{ github.ref_name }}.zip
            autonope-${{ github.ref_name }}.crx
          generate_release_notes: true
